# Publishes the app's JavaScript to phones (an EAS update on the production channel) whenever app
# code lands on main, so merging a pull request is all it takes. No terminal needed.
#
# One-off setup: an Expo access token (expo.dev > Account settings > Access tokens) saved as the
# repo secret EXPO_TOKEN (GitHub > Settings > Secrets and variables > Actions). Until it's there,
# the job skips itself.
#
# It won't publish a change that needs a new native build (app.json, eas.json, the app's
# package.json or the iOS/Android folders): an update can't carry those, and installed builds would
# get JavaScript they can't run. Those need an EAS build instead; the run says so.

name: EAS update

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "packages/ui/**"
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Needs the EXPO_TOKEN secret
        if: env.EXPO_TOKEN == ''
        run: echo "::warning::EXPO_TOKEN isn't set, so nothing was published. See the top of .github/workflows/eas-update.yml."

      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''
        with:
          fetch-depth: 50

      - name: Native change? Then it needs a build, not an update
        id: native
        if: env.EXPO_TOKEN != '' && github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if git cat-file -e "$before" 2>/dev/null; then
            changed=$(git diff --name-only "$before" "${{ github.sha }}")
          else
            changed=$(git diff --name-only HEAD~1 HEAD)
          fi
          if echo "$changed" | grep -Eq '^apps/mobile/(app\.json|eas\.json|package\.json|ios/|android/)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::This push changes native config (app.json, eas.json, package.json or ios/android), which an update can't ship. Run an EAS build instead."
          fi

      - uses: pnpm/action-setup@v4
        if: env.EXPO_TOKEN != '' && steps.native.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != '' && steps.native.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: env.EXPO_TOKEN != '' && steps.native.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != '' && steps.native.outputs.skip != 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish the update
        if: env.EXPO_TOKEN != '' && steps.native.outputs.skip != 'true'
        working-directory: apps/mobile
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'Manual update' }}
        run: |
          eas update --channel production --environment production --non-interactive \
            --message "$(printf '%s' "$MESSAGE" | head -n 1 | cut -c1-200)"
